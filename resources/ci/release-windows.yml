name: Build and verify the Windows release

# INSTALLING THIS WORKFLOW
#   Copy this file to `.github/workflows/release-windows.yml` and push it with an
#   account or GitHub App that holds the `workflows` permission. The automation
#   account that maintains this repository does not have it, which is why the
#   file lives under `resources/ci/` and has to be copied once by hand.
#
# WHAT IT DOES
#   Produces and *proves* the real DENTIVA.exe on a Windows runner:
#
#     1. quality gates      i18n catalogue, TypeScript, the full test suite,
#                           the renderer sweep
#     2. native build       Bun compiles on Windows, so the icon and the version
#                           resource are stamped by the compiler *and* rewritten
#                           from source by `scripts/stamp-exe.mjs`, giving the
#                           same resources as the cross-compiled artefact
#     3. identity gate      the executable is re-read: PE headers, x86-64, GUI
#                           subsystem, every icon size, Explorer's metadata,
#                           manifest, checksums, archive contents, no synthetic
#                           data and no compiler identity ("Oven"/"Bun")
#     4. self-test          DENTIVA.exe --self-test on a clean, empty data folder
#                           must report ok / 1.0.0 / build 100 / schema 10
#     5. packaged QA        the end-to-end clinic run in `scripts/qa-packaged.mjs`
#                           against the running executable: first-run setup,
#                           sign-in, a Bengali patient, clinical notes, a plan, a
#                           prescription, an invoice with a part payment, stock,
#                           attachments (unicode names, traversal and allow-list
#                           refusals), printed documents, all reports, backup,
#                           verify, restore and the audit trail
#     6. render check       Edge (real Chromium) renders the running application
#                           and the DOM is asserted, not just an HTTP 200
#     7. installer          install → shortcut → registry → launch → uninstall
#                           from the released archive, proving clinic data
#                           survives an uninstall; plus the portable layout
#     8. Defender scan      recorded verbatim as evidence, never as a claim
#     9. release            on a tag: executable, archive and checksums attached
#
#   Nothing here weakens a gate: every step that fails stops the run.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (for example v1.0.0)"
        required: true
        default: "v1.0.0"
      publish:
        description: "Create the GitHub release after everything passes"
        type: boolean
        default: true

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: DENTIVA ${{ github.event.inputs.version || github.ref_name }} on Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Keep the scanner off the files under test
        shell: pwsh
        run: |
          # A Windows runner re-opens every written file to scan it, and the
          # test suite writes thousands of files. The scan queue can hold a
          # database file for seconds at a time — exactly the condition the
          # application's file handling is built to wait out. On a build
          # machine it is pure noise, so the workspace and the test scratch
          # area are taken out of real-time scanning before anything runs.
          # This prepares the environment; it is not a gate and it checks
          # nothing.
          $paths = @("$env:GITHUB_WORKSPACE", "$env:TEMP")
          try {
            foreach ($path in $paths) {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
            }
            # Read the list back from the operating system so a silent
            # failure cannot hide: if an exclusion is missing, the
            # file-handling tests below would be running against a live
            # scanner, and that needs to be visible in the run record.
            $applied = @(Get-MpPreference).ExclusionPath
            $applied | ForEach-Object { Write-Host "  defender exclusion active: $_" }
            foreach ($path in $paths) {
              if ($applied -notcontains $path) {
                Write-Host "::warning::defender exclusion is NOT active for $path"
              }
            }
          } catch {
            Write-Host "::warning::defender exclusions unavailable: $($_.Exception.Message)"
          }

      - name: Record the runner (version evidence)
        shell: pwsh
        run: |
          Write-Host "Windows     : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Product     : $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').DisplayVersion)"
          Write-Host "Bun         : $(bun --version)"
          Write-Host "Node        : $(node --version)"
          Write-Host "PowerShell  : $($PSVersionTable.PSVersion)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

      - name: Quality gates (i18n, types, tests, renderer)
        shell: pwsh
        run: |
          # Every gate has to stop the run, not just the last one: PowerShell
          # only reports the exit code of the final command, which silently
          # downgraded the earlier three to decoration.
          $ErrorActionPreference = 'Continue'
          $failed = @()

          function Invoke-Gate {
            param([string]$Name, [string]$Log, [scriptblock]$Body)

            Write-Host "### $Name"
            & $Body *> $Log
            $code = $LASTEXITCODE
            Get-Content $Log | Write-Host

            if ($code -ne 0) {
              $tail = ((Get-Content $Log -Tail 25) -join ' ~ ')
              Write-Host "::error::$Name gate failed with exit code $code — $tail"
              $script:failed += $Name
            } else {
              Write-Host "  $Name gate passed"
            }

            Write-Host ''
          }

          Invoke-Gate 'i18n' 'qa-i18n.log' { bun scripts/check-i18n.mjs }
          Invoke-Gate 'typecheck' 'qa-typecheck.log' { bun x tsc --noEmit }
          Invoke-Gate 'tests' 'qa-tests.log' {
            # Windows re-opens freshly written files to scan them and can hold
            # them for several seconds, so a test that does real I/O there runs
            # longer than the 5 s default. The assertions are untouched; the
            # ceiling only has to outlast the operating system.
            bun test --timeout 120000 tests/
          }
          Invoke-Gate 'renderer' 'qa-renderer.log' { bun run qa:renderer }

          if ($failed.Count) {
            Write-Host "::error::quality gates failed: $($failed -join ', ')"
            exit 1
          }

          Write-Host 'All four quality gates passed.'

      - name: Build DENTIVA.exe, archive and checksums
        run: bun scripts/build-win.mjs --skip-tests

      - name: Test helpers for the steps below
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "QA_DATA=$($env:RUNNER_TEMP)\dentiva-qa"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "QA_STAGE=$($env:RUNNER_TEMP)\dentiva-stage"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "QA_INSTALL=$($env:RUNNER_TEMP)\dentiva-install"
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "QA_PORTABLE=$($env:RUNNER_TEMP)\dentiva-portable"

          $profileDir = Split-Path -Parent $PROFILE.CurrentUserAllHosts
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null

          @'
          function Start-Dentiva {
            param(
              [string]$Exe,
              [string]$Data,
              [int]$Port = 0
            )

            New-Item -ItemType Directory -Force -Path $Data | Out-Null

            $arguments = @(
              '--no-window',
              '--quiet',
              '--data',
              $Data
            )

            if ($Port -gt 0) {
              $arguments += @('--port', "$Port")
            }

            $app = Start-Process `
              -FilePath $Exe `
              -ArgumentList $arguments `
              -PassThru

            $instanceFile = Join-Path $Data 'instance.json'
            $deadline = (Get-Date).AddSeconds(60)

            while (-not (Test-Path $instanceFile) -and (Get-Date) -lt $deadline) {
              if ($app.HasExited) {
                throw "Dentiva exited during start-up with code $($app.ExitCode)"
              }

              Start-Sleep -Milliseconds 500
            }

            if (-not (Test-Path $instanceFile)) {
              throw 'Dentiva did not write instance.json within 60 seconds'
            }

            $instance = Get-Content $instanceFile | ConvertFrom-Json

            Write-Host "  running on $($instance.url) (pid $($instance.pid), started $($instance.startedAt))"

            return $instance
          }

          function Stop-Dentiva {
            param(
              [string]$Exe,
              [string]$Data,
              [string]$Logs
            )

            Start-Process `
              -FilePath $Exe `
              -ArgumentList '--stop', '--data', $Data `
              -Wait `
              -PassThru `
              -WindowStyle Hidden | Out-Null

            $instanceFile = Join-Path $Data 'instance.json'

            if (Test-Path $instanceFile) {
              $appPid = (Get-Content $instanceFile | ConvertFrom-Json).pid
              $deadline = (Get-Date).AddSeconds(30)

              while (
                (Get-Process -Id $appPid -ErrorAction SilentlyContinue) `
                -and (Get-Date) -lt $deadline
              ) {
                Start-Sleep -Milliseconds 300
              }

              if (Get-Process -Id $appPid -ErrorAction SilentlyContinue) {
                Write-Host "::warning::Dentiva pid $appPid ignored --stop; killing it"
                Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue
              }
            }

            if ($Logs -and (Test-Path (Join-Path $Logs 'logs'))) {
              $log = Get-ChildItem (Join-Path $Logs 'logs') -Filter '*.log' |
                Sort-Object LastWriteTime |
                Select-Object -Last 1

              if ($log) {
                Write-Host "  --- $($log.Name) (last 30 lines)"
                Get-Content $log.FullName -Tail 30 | Write-Host
              }
            }
          }

          function Get-DentivaEdge {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "$env:LOCALAPPDATA\Microsoft\Edge\Application\msedge.exe"
            )

            foreach ($candidate in $candidates) {
              if ($candidate -and (Test-Path $candidate)) {
                return $candidate
              }
            }

            return $null
          }

          function Invoke-DentivaSelfTest {
            param(
              [string]$Exe,
              [string]$Data
            )

            New-Item -ItemType Directory -Force -Path $Data | Out-Null

            $stdout = Join-Path `
              $env:TEMP `
              ('dentiva-selftest-' + [Guid]::NewGuid().ToString('n').Substring(0, 8) + '.out')

            $stderr = "$stdout.err"

            $process = Start-Process `
              -FilePath $Exe `
              -ArgumentList '--self-test', '--data', $Data `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            $text = Get-Content $stdout -Raw -ErrorAction SilentlyContinue

            Get-Content $stderr -ErrorAction SilentlyContinue | Write-Host

            Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue

            if (-not $text) {
              throw "$Exe --self-test printed nothing (exit code $($process.ExitCode))"
            }

            return [pscustomobject]@{
              ExitCode = $process.ExitCode
              Report = ($text | ConvertFrom-Json)
            }
          }
          '@ | Out-File -Append -Encoding utf8 $PROFILE.CurrentUserAllHosts

          Write-Host "helpers written to $($PROFILE.CurrentUserAllHosts)"

      - name: Report the artifacts
        shell: pwsh
        run: |
          Get-ChildItem `
            dist\windows\DENTIVA.exe, `
            dist\*.zip, `
            dist\SHA256SUMS.txt |
            Select-Object Name, Length, LastWriteTime |
            Format-Table -AutoSize

          Get-Content dist\SHA256SUMS.txt

          $exe = Get-Item dist\windows\DENTIVA.exe

          "EXE_BYTES=$($exe.Length)" >> $env:GITHUB_ENV

          "EXE_SHA256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV

          $problems = @()

          foreach ($line in Get-Content dist\SHA256SUMS.txt) {
            if (-not $line.Trim()) {
              continue
            }

            $parts = $line -split '\s+', 2
            $expected = $parts[0].Trim().ToLower()
            $name = $parts[1].Trim()

            $file = Get-Item (Join-Path 'dist' $name)
            $actual = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()

            Write-Host (
              "  {0,-32} {1}" -f `
              $name, `
              $(if ($actual -eq $expected) {
                'matches SHA256SUMS.txt'
              } else {
                'MISMATCH'
              })
            )

            if ($actual -ne $expected) {
              $problems += "$name does not match the published SHA-256"
            }
          }

          if ($problems.Count) {
            $problems | ForEach-Object {
              Write-Host "::error::$_"
            }

            exit 1
          }

      - name: Explorer metadata and PE headers
        shell: pwsh
        run: |
          $exe = 'dist\windows\DENTIVA.exe'
          $v = (Get-Item $exe).VersionInfo

          $expected = @{
            CompanyName      = 'Md. Shohan Khan'
            FileDescription  = 'Dentiva — Dental Practice Management System'
            FileVersion      = '1.0.0.100'
            ProductVersion   = '1.0.0.100'
            ProductName      = 'Dentiva'
            InternalName     = 'DENTIVA.exe'
            OriginalFilename = 'DENTIVA.exe'
          }

          $problems = @()

          foreach ($key in $expected.Keys) {
            $actual = $v.$key

            Write-Host (
              "  {0,-17} {1}" -f `
              $key, `
              $actual
            )

            if ($actual -ne $expected[$key]) {
              $problems += "$key is '$actual', expected '$($expected[$key])'"
            }
          }

          if ($v.LegalCopyright -notmatch 'Md\. Shohan Khan') {
            $problems += "LegalCopyright is '$($v.LegalCopyright)'"
          }

          foreach ($foreign in 'Bun', 'Oven', 'bun.exe') {
            if (($v | Out-String) -match [regex]::Escape($foreign)) {
              $problems += "compiler identity '$foreign' is still present"
            }
          }

          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)

          $checks = @{
            MZ = (
              $bytes[0] -eq 0x4d -and
              $bytes[1] -eq 0x5a
            )

            PE = (
              [Text.Encoding]::ASCII.GetString(
                $bytes,
                $peOffset,
                4
              ) -eq "PE`0`0"
            )

            x86_64 = (
              [BitConverter]::ToUInt16(
                $bytes,
                $peOffset + 4
              ) -eq 0x8664
            )

            PE32Plus = (
              [BitConverter]::ToUInt16(
                $bytes,
                $peOffset + 24
              ) -eq 0x20b
            )

            WindowsGUISubsystem = (
              [BitConverter]::ToUInt16(
                $bytes,
                $peOffset + 24 + 68
              ) -eq 2
            )
          }

          foreach ($key in $checks.Keys) {
            Write-Host (
              "  {0,-20} {1}" -f `
              $key, `
              $checks[$key]
            )

            if (-not $checks[$key]) {
              $problems += "PE check failed: $key"
            }
          }

          if ($problems.Count) {
            $problems | ForEach-Object {
              Write-Host "::error::$_"
            }

            exit 1
          }

          Write-Host 'Explorer metadata and PE headers are correct.'

      - name: Record every embedded resource
        shell: pwsh
        run: |
          bun scripts/stamp-exe.mjs --check dist\windows\DENTIVA.exe 2>&1 |
            Tee-Object -FilePath resource-report.txt

          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::the executable does not carry Dentiva resources'
            exit 1
          }

          Write-Host ''
          Write-Host 'Icon frames and Explorer metadata were read back from the released executable.'

      - name: Icon resources at every Windows size
        shell: powershell
        run: |
          # This is the one step that uses Windows PowerShell (5.1) rather than
          # PowerShell 7: System.Drawing is the framework's own icon reader, and
          # the runner injects $ErrorActionPreference = 'Stop' around every step.
          # Errors are handled explicitly below, so preference is set to
          # Continue: no stray non-terminating error may end this step with an
          # exit code and nothing said.
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Drawing

          $exe = (Resolve-Path 'dist\windows\DENTIVA.exe').Path

          # Every measurement is recorded so that a failure says *what* Windows
          # saw, not just that something went wrong.
          $script:report = @()

          function Get-OpaqueSamples($bitmap) {
            $opaque = 0
            $sampled = 0

            $stepX = [Math]::Max(
              1,
              [int]($bitmap.Width / 8)
            )

            $stepY = [Math]::Max(
              1,
              [int]($bitmap.Height / 8)
            )

            for ($x = 0; $x -lt $bitmap.Width; $x += $stepX) {
              for ($y = 0; $y -lt $bitmap.Height; $y += $stepY) {
                $sampled++

                if ($bitmap.GetPixel($x, $y).A -gt 0) {
                  $opaque++
                }
              }
            }

            return @{
              Opaque = $opaque
              Sampled = $sampled
            }
          }

          try {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)

            if (-not $icon) {
              Write-Host '::error::ICON-GATE: Windows could not extract an icon from the executable'
              exit 1
            }

            Write-Host "  associated icon: $($icon.Width)x$($icon.Height)"
            Write-Host '  expected sizes : 16, 24, 32, 48, 64, 128, 256'
            $script:report += "associated $($icon.Width)x$($icon.Height)"

            $bitmap = $icon.ToBitmap()
            $check = Get-OpaqueSamples $bitmap

            Write-Host "  associated icon: $($check.Opaque)/$($check.Sampled) sampled pixels are opaque"
            $script:report += "associated opaque $($check.Opaque)/$($check.Sampled)"

            if ($check.Opaque -eq 0) {
              $bitmap.Dispose()
              $icon.Dispose()
              Write-Host '::error::ICON-GATE: Windows loaded a completely transparent icon'
              exit 1
            }

            $bitmap.Dispose()

            # Reading the executable the way a stand-alone .ico is read does not
            # work and never did: System.Drawing.Icon(file, width, height) reads
            # an .ico stream, not a PE resource directory. It is recorded for
            # completeness and is not allowed to pass or fail anything.
            foreach ($size in 16, 24, 32, 48, 64, 128, 256) {
              try {
                $sized = New-Object System.Drawing.Icon(
                  $exe,
                  $size,
                  $size
                ) -ErrorAction Stop

                $tile = $sized.ToBitmap()
                $detail = Get-OpaqueSamples $tile

                Write-Host (
                  "  {0,3}px -> {1}x{2} read from the executable, {3}/{4} sampled pixels opaque" -f `
                  $size,
                  $tile.Width,
                  $tile.Height,
                  $detail.Opaque,
                  $detail.Sampled
                )

                $script:report += "${size}px from file ${detail.Opaque}/${detail.Sampled}"

                $tile.Dispose()
                $sized.Dispose()
              }
              catch {
                $message = $_.Exception.Message

                Write-Host (
                  "  ${size}px - not read from the executable path: $message"
                )

                $script:report += "${size}px not read from file ($message)"
              }
            }

            # The check that matters: Windows has the mark, and every size it
            # asks for comes back with something drawn on it. This is how
            # Explorer, the taskbar and the Start Menu produce the sizes they
            # draw - by rescaling the icon the shell extracted.
            foreach ($size in 16, 24, 32, 48, 64, 128, 256) {
              try {
                $scaled = New-Object System.Drawing.Icon(
                  $icon,
                  $size,
                  $size
                ) -ErrorAction Stop

                $tile = $scaled.ToBitmap()
                $detail = Get-OpaqueSamples $tile

                Write-Host (
                  "  {0,3}px -> {1}x{2} rescaled, {3}/{4} sampled pixels opaque" -f `
                  $size,
                  $tile.Width,
                  $tile.Height,
                  $detail.Opaque,
                  $detail.Sampled
                )

                $script:report += "${size}px rescaled ${detail.Opaque}/${detail.Sampled}"

                if ($detail.Opaque -eq 0) {
                  $tile.Dispose()
                  $scaled.Dispose()
                  Write-Host "::error::ICON-GATE: the ${size}px icon rescales to nothing"
                  exit 1
                }

                $tile.Dispose()
                $scaled.Dispose()
              }
              catch {
                $message = $_.Exception.Message

                Write-Host (
                  "  ${size}px - the extracted icon could not be rescaled: $message"
                )

                Write-Host "::error::ICON-GATE: Windows could not produce the ${size}px icon: $message"
                exit 1
              }
            }

            $icon.Dispose()

            Write-Host 'Icon resources load and are not blank.'
            exit 0
          }
          catch {
            $detail = $script:report -join '; '
            Write-Host (
              "::error::ICON-GATE: $($_.Exception.GetType().Name): $($_.Exception.Message) " +
                "- measurements: $detail"
            )
            exit 1
          }

      - name: Application self-test on a clean data folder
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $data = Join-Path $env:QA_DATA 'self-test'

          $result = Invoke-DentivaSelfTest `
            -Exe 'dist\windows\DENTIVA.exe' `
            -Data $data

          $report = $result.Report

          $report |
            ConvertTo-Json -Depth 4 |
            Write-Host

          $banner = & (
            Resolve-Path 'dist\windows\DENTIVA.exe'
          ).Path --version 2>&1

          Write-Host "  --version: $($banner -join ' ')"

          $problems = @()

          if ($result.ExitCode -ne 0) {
            $problems += "--self-test exited with $($result.ExitCode)"
          }

          if ($report.ok -ne $true) {
            $problems += 'ok is not true'
          }

          if ($report.version -ne '1.0.0') {
            $problems += "version is $($report.version)"
          }

          if ([int]$report.build -ne 100) {
            $problems += "build is $($report.build)"
          }

          if ([int]$report.schema -ne 10) {
            $problems += "schema is $($report.schema)"
          }

          if (-not $report.dataDir) {
            $problems += 'no data directory reported'
          }

          if ($problems.Count) {
            $problems | ForEach-Object {
              Write-Host "::error::self-test: $_"
            }

            exit 1
          }

          Get-ChildItem -Recurse $data |
            Select-Object -First 20 FullName |
            Format-Table -AutoSize

          $database = Get-ChildItem `
            -Recurse $data `
            -Filter '*.db' |
            Select-Object -First 1

          if (-not $database) {
            Write-Host '::error::the database was not created in the data folder'
            exit 1
          }

          Write-Host (
            "Self-test passed — database created at $($database.FullName)."
          )

      - name: End-to-end clinic workflow against the packaged executable
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $exe = 'dist\windows\DENTIVA.exe'

          $instance = Start-Dentiva `
            -Exe $exe `
            -Data $env:QA_DATA

          try {
            bun scripts/qa-packaged.mjs `
              --data $env:QA_DATA `
              --report qa-report.json `
              --documents qa-documents

            if ($LASTEXITCODE -ne 0) {
              throw "packaged QA failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Stop-Dentiva `
              -Exe $exe `
              -Data $env:QA_DATA `
              -Logs $env:QA_DATA
          }

      - name: Every print document as a PDF
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $edge = Get-DentivaEdge

          if (-not $edge) {
            Write-Host '::warning::Microsoft Edge is not installed on this runner — PDF checks skipped'
            exit 0
          }

          $source = 'qa-documents'

          if (-not (Test-Path $source)) {
            Write-Host '::error::the packaged QA step did not capture the documents'
            exit 1
          }

          # Absolute: the headless browser resolves --print-to-pdf against
          # its own working directory, which is not the checkout, so a
          # relative target path is a file it cannot find.
          $outputs = [IO.Path]::GetFullPath('qa-pdfs')

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outputs |
            Out-Null

          $exe = 'dist\windows\DENTIVA.exe'

          $first = Get-ChildItem `
            (Join-Path $source '*.html') |
            Select-Object -First 1

          $port = 0

          if (
            $first -and
            (
              Get-Content $first.FullName -Raw
            ) -match 'http://127\.0\.0\.1:(\d+)/'
          ) {
            $port = [int]$Matches[1]
          }

          if ($port -eq 0) {
            Write-Host '::warning::captured documents contain no application URL — fallback fonts may be used'
          }

          $instance = Start-Dentiva `
            -Exe $exe `
            -Data $env:QA_DATA `
            -Port $port

          Write-Host "  application is running on $($instance.port)"

          if (
            $port -ne 0 -and
            [int]$instance.port -ne $port
          ) {
            Write-Host "::warning::application came up on $($instance.port) instead of $port"
          }

          # The print engine's version belongs in the run record: this
          # invocation has had engine regressions before, and a failure
          # without a version attached is undiagnosable. Read from the
          # executable's version info — `--version` on the command line
          # prints nothing in this environment.
          $edgeVersion = (Get-Item $edge).VersionInfo.ProductVersion
          Write-Host "  print engine: Microsoft Edge $edgeVersion"

          $expected = @{
            A4        = @(595, 842)
            A5        = @(420, 595)
            Letter    = @(612, 792)
            Legal     = @(612, 1008)
            Receipt80 = @(227, 842)
            Receipt58 = @(164, 842)
          }

          $problems = @()
          $mismatches = @()
          $made = 0

          try {
            foreach (
              $file in Get-ChildItem (Join-Path $source '*.html') |
                Sort-Object Name
            ) {
              $pdf = Join-Path `
                $outputs `
                ($file.BaseName + '.pdf')

              $url = 'file:///' + $file.FullName.Replace('\', '/')

              # A fresh profile per document, forward-slash output path,
              # and SmartScreen disabled: Edge 141's headless print path
              # regressed, and this is the argument shape that survived
              # the regression. The engine's own output is kept — a
              # failed print must arrive with the engine's words behind
              # it, not just our complaint.
              $profile = Join-Path $env:TEMP ("dentiva-edge-pdf-" + $file.BaseName)
              $engineLog = Join-Path $outputs ($file.BaseName + '.engine.log')

              & $edge `
                --headless=new `
                --disable-gpu `
                --no-first-run `
                --smartscreen-disable `
                --no-pdf-header-footer `
                --user-data-dir="$profile" `
                --virtual-time-budget=20000 `
                --print-to-pdf="$($pdf.Replace('\', '/'))" `
                $url 2> $engineLog |
                Out-Null

              Remove-Item -Recurse -Force -Path $profile -ErrorAction SilentlyContinue

              if (-not (Test-Path $pdf)) {
                $engineSaid = ''
                if (Test-Path $engineLog) {
                  $engineSaid = (
                    Get-Content $engineLog |
                      Where-Object { $_ -ne '' } |
                      Select-Object -First 4
                  ) -join ' | '
                }
                $problems += "the $($file.BaseName) document produced no PDF ($edgeVersion; engine: $engineSaid)"
                continue
              }

              $bytes = [IO.File]::ReadAllBytes($pdf)
              $text = [Text.Encoding]::ASCII.GetString($bytes)

              if (-not $text.StartsWith('%PDF-')) {
                $problems += "$($file.BaseName): output is not a PDF"
                continue
              }

              if (-not $text.Contains('%%EOF')) {
                $problems += "$($file.BaseName): PDF has no trailer"
                continue
              }

              if (-not ($text -match '/Type\s*/Page[^s]')) {
                $problems += "$($file.BaseName): PDF has no page object"
                continue
              }

              if ($bytes.Length -lt 5000) {
                $problems += "$($file.BaseName): PDF is only $($bytes.Length) bytes"
                continue
              }

              $made++

              $box = 'not reported by this engine'

              if (
                $text -match '/MediaBox\s*\[\s*0(?:\.0+)?\s+0(?:\.0+)?\s+([\d.]+)\s+([\d.]+)'
              ) {
                $width = [double]$Matches[1]
                $height = [double]$Matches[2]

                $box = "$([math]::Round($width)) x $([math]::Round($height)) pt"

                if ($file.BaseName -like 'paper-*') {
                  $paper = $file.BaseName.Replace('paper-', '')

                  if ($expected.ContainsKey($paper)) {
                    $want = $expected[$paper]

                    $fits = (
                      [math]::Abs($width - $want[0]) -le 3
                    ) -and (
                      [math]::Abs($height - $want[1]) -le 3
                    )

                    if (-not $fits) {
                      $mismatches += (
                        "$paper is $box, expected $($want[0]) x $($want[1]) pt"
                      )
                    }
                    else {
                      $box = "$box (matches $paper)"
                    }
                  }
                }
              }

              Write-Host (
                "  {0,-22} {1,8} bytes  {2}" -f `
                $file.BaseName,
                $bytes.Length,
                $box
              )
            }
          }
          finally {
            Stop-Dentiva `
              -Exe $exe `
              -Data $env:QA_DATA `
              -Logs $env:QA_DATA
          }

          Write-Host ''
          Write-Host "  $made document PDFs written to $outputs"

          if ($mismatches.Count) {
            Write-Host '::warning::print engine selected a different MediaBox than requested'
            $mismatches | ForEach-Object {
              Write-Host "  - $_"
            }
          }

          if ($problems.Count) {
            $problems | ForEach-Object {
              Write-Host "::error::PDF: $_"
            }

            exit 1
          }

          Write-Host 'Every document produced a real PDF.'

      - name: Real-renderer smoke test (Edge, headless)
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $exe = 'dist\windows\DENTIVA.exe'
          $edge = Get-DentivaEdge

          if (-not $edge) {
            Write-Host '::warning::Microsoft Edge is not installed on this runner — render check skipped'
            exit 0
          }

          $data = Join-Path $env:QA_DATA 'render'

          $instance = Start-Dentiva `
            -Exe $exe `
            -Data $data

          try {
            $profile = Join-Path $env:TEMP 'dentiva-edge-qa'

            $edgeVersion = (Get-Item $edge).VersionInfo.ProductVersion
            Write-Host "  render engine: Microsoft Edge $edgeVersion"

            $renderLog = Join-Path $data 'edge-render.log'

            $dom = & $edge `
              --headless=new `
              --disable-gpu `
              --no-first-run `
              --smartscreen-disable `
              --user-data-dir="$profile" `
              --virtual-time-budget=15000 `
              --dump-dom `
              $instance.url 2> $renderLog

            $domText = ($dom -join "`n")

            $domText |
              Out-File `
                -Encoding utf8 `
                render-dom.html

            $markers = @{
              'application shell' = 'id="app"'
              'navigation' = 'id="nav"'
              'view container' = 'id="view"'
              'sidebar' = 'id="sidebar"'
            }

            $problems = @()

            foreach ($label in $markers.Keys) {
              $needle = $markers[$label]
              $present = $domText.Contains($needle)

              Write-Host (
                "  {0,-18} {1}" -f `
                $label,
                $present
              )

              if (-not $present) {
                $problems += "rendered DOM has no $label"
              }
            }

            if ($domText -notmatch '(?i)dentiva') {
              $problems += 'rendered DOM has no Dentiva product name'
            }

            if (
              $domText -match
              'could not be loaded from the application package'
            ) {
              $problems += 'rendered page is the startup fallback'
            }

            if ($problems.Count) {
              $problems | ForEach-Object {
                Write-Host "::error::render check: $_"
              }

              exit 1
            }

            Write-Host "Edge rendered $($domText.Length) bytes of DOM."
          }
          finally {
            Stop-Dentiva `
              -Exe $exe `
              -Data $data `
              -Logs $data
          }

      - name: Layout at 100–200 percent scaling
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $edge = Get-DentivaEdge

          if (-not $edge) {
            Write-Host '::warning::Microsoft Edge is not installed on this runner — scaling checks skipped'
            exit 0
          }

          $exe = 'dist\windows\DENTIVA.exe'
          $data = Join-Path $env:QA_DATA 'scaling'

          $instance = Start-Dentiva `
            -Exe $exe `
            -Data $data

          try {
            $profile = Join-Path $env:TEMP 'dentiva-edge-scaling'
            $problems = @()

            $cases = @(
              @{ scale = '1';    window = '1280,720';  label = '100% 1280x720' },
              @{ scale = '1.25'; window = '1280,720';  label = '125% 1280x720' },
              @{ scale = '1.5';  window = '1600,900';  label = '150% 1600x900' },
              @{ scale = '1.75'; window = '1920,1080'; label = '175% 1920x1080' },
              @{ scale = '2';    window = '2560,1440'; label = '200% 2560x1440' },
              @{ scale = '1';    window = '2560,1440'; label = '100% 2560x1440 maximised' },
              @{ scale = '1.25'; window = '1024,768';  label = '125% 1024x768 narrow' }
            )

            foreach ($case in $cases) {
              $dom = & $edge `
                --headless=new `
                --disable-gpu `
                --no-first-run `
                --user-data-dir="$profile" `
                --force-device-scale-factor=$($case.scale) `
                --window-size=$($case.window) `
                --virtual-time-budget=15000 `
                --dump-dom `
                $instance.url 2>$null

              $text = ($dom -join "`n")

              $ok = (
                $text.Contains('id="view"') -and
                ($text -match '(?i)dentiva')
              )

              if (
                $text -match
                'could not be loaded from the application package'
              ) {
                $ok = $false
              }

              Write-Host (
                "  {0,-28} {1} ({2} bytes)" -f `
                $case.label,
                $(if ($ok) { 'rendered' } else { 'FAILED' }),
                $text.Length
              )

              if (-not $ok) {
                $problems += "application did not render at $($case.label)"
              }

              $safeName = $case.label -replace '[^0-9A-Za-z]+', '-'

              $text |
                Out-File `
                  -Encoding utf8 `
                  (Join-Path (Get-Location) "scaling-$safeName.html")
            }

            if ($problems.Count) {
              $problems | ForEach-Object {
                Write-Host "::error::scaling: $_"
              }

              exit 1
            }

            Write-Host 'Scaling and window-size checks passed.'
          }
          finally {
            Stop-Dentiva `
              -Exe $exe `
              -Data $data `
              -Logs $data
          }

      - name: Installer — install, shortcut, registry, launch, uninstall
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $problems = @()

          $archive = Get-ChildItem dist\*.zip |
            Select-Object -First 1

          Expand-Archive `
            -Path $archive.FullName `
            -DestinationPath $env:QA_STAGE `
            -Force

          $installDir = Join-Path `
            $env:QA_INSTALL `
            'Programs\Dentiva'

          powershell `
            -ExecutionPolicy Bypass `
            -NoProfile `
            -File (Join-Path $env:QA_STAGE 'install.ps1') `
            -InstallDir $installDir

          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 failed with exit code $LASTEXITCODE"
          }

          $installedExe = Join-Path `
            $installDir `
            'DENTIVA.exe'

          foreach (
            $relative in @(
              'DENTIVA.exe',
              'uninstall.ps1',
              'icon.ico',
              'docs\USER-GUIDE.md'
            )
          ) {
            if (-not (Test-Path (Join-Path $installDir $relative))) {
              $problems += "installer did not create $relative"
            }
          }

          $shell = New-Object -ComObject WScript.Shell

          $startMenu = Join-Path `
            $env:APPDATA `
            'Microsoft\Windows\Start Menu\Programs\Dentiva.lnk'

          $desktop = Join-Path `
            ([Environment]::GetFolderPath('Desktop')) `
            'Dentiva.lnk'

          foreach ($link in @($startMenu, $desktop)) {
            if (-not (Test-Path $link)) {
              $problems += "no shortcut at $link"
              continue
            }

            $shortcut = $shell.CreateShortcut($link)

            Write-Host (
              "shortcut: target $($shortcut.TargetPath) · icon $($shortcut.IconLocation)"
            )

            if ($shortcut.TargetPath -ne $installedExe) {
              $problems += "shortcut points at '$($shortcut.TargetPath)'"
            }

            if ($shortcut.IconLocation -notlike "$installedExe*") {
              $problems += "shortcut icon is '$($shortcut.IconLocation)'"
            }
          }

          $uninstallKey = `
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Dentiva'

          if (-not (Test-Path $uninstallKey)) {
            $problems += 'no Apps & Features uninstall entry'
          }
          else {
            $entry = Get-ItemProperty $uninstallKey

            Write-Host (
              "Apps & features: $($entry.DisplayName) $($entry.DisplayVersion) — $($entry.Publisher)"
            )

            if ($entry.DisplayVersion -ne '1.0.0') {
              $problems += "uninstall entry reports version $($entry.DisplayVersion)"
            }

            if ($entry.Publisher -ne 'Md. Shohan Khan') {
              $problems += "uninstall entry reports publisher $($entry.Publisher)"
            }

            if ($entry.UninstallString -notmatch 'uninstall\.ps1') {
              $problems += 'uninstall entry does not point at uninstall.ps1'
            }
          }

          $installerData = Join-Path `
            $env:QA_DATA `
            'installer'

          $result = Invoke-DentivaSelfTest `
            -Exe $installedExe `
            -Data $installerData

          Write-Host (
            "installed executable self-test: ok=$($result.Report.ok) version=$($result.Report.version) build=$($result.Report.build)"
          )

          if (
            $result.ExitCode -ne 0 -or
            $result.Report.ok -ne $true
          ) {
            $problems += 'installed executable failed self-test'
          }

          $clinicData = Join-Path `
            $env:LOCALAPPDATA `
            'Dentiva'

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $clinicData |
            Out-Null

          $marker = Join-Path `
            $clinicData `
            'uninstall-marker.txt'

          'clinic data that must survive' |
            Out-File $marker

          powershell `
            -ExecutionPolicy Bypass `
            -NoProfile `
            -File (Join-Path $installDir 'uninstall.ps1') `
            -Force

          if (Test-Path $installedExe) {
            $problems += 'uninstall left the program behind'
          }

          if (Test-Path $startMenu) {
            $problems += 'uninstall left Start Menu shortcut'
          }

          if (Test-Path $desktop) {
            $problems += 'uninstall left desktop shortcut'
          }

          if (Test-Path $uninstallKey) {
            $problems += 'uninstall left Apps & Features entry'
          }

          if (-not (Test-Path $marker)) {
            $problems += 'uninstall deleted clinic data'
          }
          else {
            Write-Host 'clinic data survived the uninstall'
          }

          Remove-Item `
            $marker `
            -Force `
            -ErrorAction SilentlyContinue

          if ($problems.Count) {
            $problems | ForEach-Object {
              Write-Host "::error::installer: $_"
            }

            exit 1
          }

          Write-Host 'Installer verification passed.'

      - name: Portable layout from the release archive
        shell: pwsh
        run: |
          . $PROFILE.CurrentUserAllHosts

          $archive = Get-ChildItem dist\*.zip |
            Select-Object -First 1

          Expand-Archive `
            -Path $archive.FullName `
            -DestinationPath $env:QA_PORTABLE `
            -Force

          $exe = Join-Path `
            $env:QA_PORTABLE `
            'DENTIVA.exe'

          if (-not (Test-Path $exe)) {
            Write-Host '::error::archive does not contain DENTIVA.exe'
            exit 1
          }

          foreach (
            $name in @(
              'install.cmd',
              'install.ps1',
              'uninstall.ps1',
              'README.md',
              'LICENSE',
              'THIRD-PARTY-NOTICES.txt',
              'icon.ico'
            )
          ) {
            if (-not (Test-Path (Join-Path $env:QA_PORTABLE $name))) {
              Write-Host "::error::archive is missing $name"
              exit 1
            }
          }

          powershell `
            -ExecutionPolicy Bypass `
            -NoProfile `
            -File (Join-Path $env:QA_PORTABLE 'install.ps1') `
            -Portable

          $portableData = Join-Path `
            $env:QA_PORTABLE `
            'data'

          if (-not (Test-Path $portableData)) {
            Write-Host '::error::portable mode did not create its data folder'
            exit 1
          }

          $result = Invoke-DentivaSelfTest `
            -Exe $exe `
            -Data $portableData

          $result.Report |
            ConvertTo-Json -Depth 4 |
            Write-Host

          if (
            $result.ExitCode -ne 0 -or
            $result.Report.ok -ne $true
          ) {
            Write-Host '::error::portable copy failed self-test'
            exit 1
          }

          if ($result.Report.dataDir -notlike "$env:QA_PORTABLE*") {
            Write-Host (
              "::error::portable mode wrote to $($result.Report.dataDir) instead of beside the executable"
            )

            exit 1
          }

          Write-Host "Portable mode verified — data in $($result.Report.dataDir)"

      - name: Windows Defender scan (recorded, not asserted)
        shell: pwsh
        continue-on-error: true
        run: |
          $scan = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"

          if (Test-Path $scan) {
            & $scan `
              -Scan `
              -ScanType 3 `
              -File (Resolve-Path 'dist\windows\DENTIVA.exe').Path 2>&1 |
              Tee-Object -FilePath defender-scan.log

            Write-Host "Defender exit code: $LASTEXITCODE"
          }
          else {
            'Windows Defender CLI is unavailable on this runner.' |
              Out-File defender-scan.log
          }

      - name: Signing status (recorded)
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature `
            (Resolve-Path 'dist\windows\DENTIVA.exe').Path

          "status=$($signature.Status)" |
            Tee-Object -FilePath signature-status.txt

          Write-Host "Authenticode status: $($signature.Status)"

          if ($signature.Status -ne 'NotSigned') {
            Write-Host "  signer: $($signature.SignerCertificate.Subject)"
          }
          else {
            Write-Host '  no code-signing certificate is used; SmartScreen may warn on first launch.'
          }

      - name: Upload the release evidence
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-windows-x64
          path: |
            dist/windows/DENTIVA.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            qa-report.json
            qa-pdfs/*.pdf
            qa-documents/*.html
            render-dom.html
            scaling-*.html
            resource-report.txt
            defender-scan.log
            signature-status.txt
          if-no-files-found: error

      - name: Job summary
        shell: pwsh
        run: |
          $lines = @()

          $lines += '## DENTIVA Windows release'
          $lines += ''
          $lines += '| artefact | size | SHA-256 |'
          $lines += '| --- | --- | --- |'

          $lines += "| DENTIVA.exe | $([math]::Round($env:EXE_BYTES / 1MB, 1)) MB | ``$($env:EXE_SHA256)`` |"

          Get-Content dist\SHA256SUMS.txt |
            ForEach-Object {
              $parts = $_ -split '\s+', 2
              $lines += "| $($parts[1]) | — | ``$($parts[0])`` |"
            }

          if (Test-Path qa-report.json) {
            $qa = Get-Content qa-report.json |
              ConvertFrom-Json

            $lines += ''
            $lines += "Packaged QA: **$($qa.passed)/$($qa.checks.Count) checks passed** against the running executable."
          }

          $lines += ''
          $lines += '### Windows-only checks performed in this run'
          $lines += ''
          $lines += '| check | evidence |'
          $lines += '| --- | --- |'
          $lines += '| native Windows build, PE headers, Explorer metadata, version resource | PE + metadata step, resource-report.txt |'
          $lines += '| icon extraction at 16–256 px | icon step, resource-report.txt |'
          $lines += '| DENTIVA.exe --self-test | self-test step |'
          $lines += '| first-run setup, sign-in, clinical, billing, inventory, reports, backup and restore | qa-report.json |'
          $lines += '| every print document and paper choice as PDF | qa-pdfs/, qa-documents/ |'
          $lines += '| real Edge rendering and scaling | render-dom.html, scaling-*.html |'
          $lines += '| installer, shortcuts, registry, uninstall with data kept, portable mode | installer and portable steps |'
          $lines += '| Defender scan | defender-scan.log |'
          $lines += '| Authenticode status | signature-status.txt |'
          $lines += '| SHA-256 verification | artifact verification step |'
          $lines += ''
          $lines += 'Physical-printer testing is not covered by this hosted workflow.'
          $lines += 'Code signing is not used; the executable is unsigned and SmartScreen may warn.'

          $lines -join "`n" |
            Out-File `
              -Append `
              -Encoding utf8 `
              $env:GITHUB_STEP_SUMMARY

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/windows/DENTIVA.exe \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "Dentiva ${TAG#v} — Windows x64" \
            --notes "Dentiva ${TAG#v} — offline-first dental practice management system for Windows. Built and verified on a Windows runner. See docs/INSTALL.md and docs/CHANGELOG.md." \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$TAG" \
            dist/windows/DENTIVA.exe \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
